<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hlepi studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#DCE6EC;--sf:#fff;--ink:#16202A;--mut:#5B6874;--ln:#C3CFD8;--ac:#1D6A8A;--on:#fff;--sheet:#FFFEFB;--warn:#B3402A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A22;--sf:#16252F;--ink:#E4ECF1;--mut:#92A3AF;--ln:#2A3C48;--ac:#6DB8D8;--on:#0E1A22;--sheet:#1B2B36;--warn:#E7846E}}
:root[data-theme="dark"]{--bg:#0E1A22;--sf:#16252F;--ink:#E4ECF1;--mut:#92A3AF;--ln:#2A3C48;--ac:#6DB8D8;--on:#0E1A22;--sheet:#1B2B36;--warn:#E7846E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.45 "Instrument Sans",system-ui,sans-serif}
header{padding:10px 16px 6px}
header input{width:100%;border:0;background:none;color:var(--ink);font:600 20px "Instrument Sans",sans-serif;padding:4px 0}
header small{color:var(--mut);display:block;font-size:12px;line-height:1.2}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand b{font-size:17px;line-height:1.2}
.brand svg{flex:none}
main{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 16px}
section{display:none}section.on{display:block}
nav{display:flex;border-top:1px solid var(--ln);background:var(--sf)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--mut);font:500 15px "Instrument Sans",sans-serif;border-top:3px solid transparent;margin-top:-1px}
nav button.on{color:var(--ac);border-top-color:var(--ac);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sheet{background:var(--sheet);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:2px;padding:6px 10px}
textarea,input,select{font:inherit;color:var(--ink)}
#script{width:100%;min-height:46vh;border:0;background:none;resize:vertical;font:400 15px/1.6 "Courier Prime","Courier New",monospace}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:9px 12px;border-radius:8px;font:500 14px "Instrument Sans",sans-serif}
.btn.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
.btn:disabled{opacity:.5}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:9px 12px}
.out{white-space:pre-wrap;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px;margin:10px 0}
.out:empty{display:none}
.err{color:var(--warn)}
h2{font-size:17px;margin:14px 0 4px}
.shot{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}
.shot b{display:block}.shot span{color:var(--mut);font-size:14px}
.shot p{margin:2px 0 0}
.shot button{margin-left:auto;border:0;background:none;color:var(--mut);font-size:20px;padding:0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .w{grid-column:1/-1}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:9px 10px}
.empty{color:var(--mut);padding:18px 4px}
#prev{width:100%;max-height:260px;object-fit:cover;border-radius:8px;display:none;margin:8px 0}
.cap{display:block;text-align:center;border:2px dashed var(--ac);color:var(--ac);border-radius:10px;padding:22px 10px;font-weight:600}
.cap input{display:none}
.note{color:var(--mut);font-size:13px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{50%{opacity:.45}}
@keyframes fall{to{opacity:0;transform:translateX(24px)}}
.brand svg rect:not(:first-of-type){transform-box:fill-box;transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.8,.2,1) .15s backwards}
.brand svg path{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.5,.5,1) .6s backwards}
section.on{animation:rise .28s ease-out}
.shot.new{animation:rise .35s ease-out backwards}
.shot.gone{animation:fall .2s ease-in forwards}
.out:not(:empty){animation:rise .25s ease-out}
#prev{animation:pop .3s ease-out}
.btn{transition:transform .12s,background-color .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.busy{animation:pulse 1s ease-in-out infinite}
nav button{transition:color .2s,border-color .2s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="brand"><svg width="38" height="38" viewBox="0 0 36 36" role="img" aria-label="Logo Hlepi studio"><rect width="36" height="36" rx="9" fill="var(--ac)"/><rect x="8" y="8" width="5" height="20" rx="1.5" fill="var(--on)"/><rect x="23" y="8" width="5" height="20" rx="1.5" fill="var(--on)"/><path d="M15.2 13.2 21.4 18l-6.2 4.8z" fill="var(--on)"/></svg><div><b>Hlepi studio</b><small>Enregistré sur cet appareil</small></div></div><input id="title" aria-label="Titre du projet" placeholder="Titre du projet"></header>
<main>
<section id="t-write" class="on">
  <div class="sheet"><textarea id="script" aria-label="Scénario" placeholder="INT. APPARTEMENT – NUIT&#10;&#10;Commencez à écrire, ou demandez une idée à l'IA."></textarea></div>
  <div class="row">
    <button class="btn" data-ins="INT. LIEU – JOUR">+ Intérieur</button>
    <button class="btn" data-ins="EXT. LIEU – JOUR">+ Extérieur</button>
    <button class="btn" data-ins="PERSONNAGE">+ Dialogue</button>
  </div>
  <div class="ask"><input id="q" placeholder="Demandez à l'IA : une scène, une idée…"><button class="btn p" id="go">Envoyer</button></div>
  <div class="row">
    <button class="btn" data-ai="continue">Continuer la scène</button>
    <button class="btn" data-ai="rewrite">Reformuler la sélection</button>
    <button class="btn" data-ai="dialog">Dialogue plus naturel</button>
  </div>
  <div class="out" id="wout"></div>
  <div class="row" id="wact" hidden><button class="btn p" id="ins">Insérer dans le scénario</button></div>
</section>

<section id="t-shots">
  <div class="form">
    <input class="w" id="s-scene" placeholder="Scène (ex : 3 – Cuisine, nuit)">
    <select id="s-size"><option>Plan large</option><option>Plan moyen</option><option>Plan rapproché</option><option>Gros plan</option><option>Insert</option><option>Plan d'ensemble</option></select>
    <select id="s-move"><option>Fixe</option><option>Panoramique</option><option>Travelling</option><option>Épaule</option><option>Steadicam</option><option>Drone</option></select>
    <textarea class="w" id="s-desc" rows="2" placeholder="Ce qu'on voit, l'intention"></textarea>
  </div>
  <div class="row"><button class="btn p" id="addshot">Ajouter le plan</button><button class="btn" id="aishots">Proposer un découpage (IA)</button></div>
  <div class="out" id="sout"></div>
  <div id="shots"></div>
</section>

<section id="t-loc">
  <label class="cap">Photographier ou choisir le lieu<input type="file" id="photo" accept="image/*" capture="environment"></label>
  <img id="prev" alt="Photo du lieu">
  <div class="form"><textarea class="w" id="intent" rows="3" placeholder="Ce que vous voulez tourner ici : scène, ambiance, heure, nombre de personnes…"></textarea></div>
  <div class="row"><button class="btn p" id="analyze">Analyser le lieu</button></div>
  <p class="note">L'IA propose l'aménagement du décor, les positions de caméra, la lumière et le son selon votre scène.</p>
  <div class="out" id="lout"></div>
</section>
</main>
<nav><button class="on" data-tab="write">Écrire</button><button data-tab="shots">Plans</button><button data-tab="loc">Repérage</button></nav>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KEY="sequence:v1";
let S={title:"",script:"",shots:[],loc:{intent:"",out:""}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let tm;function save(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},300)}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Onglets */
$$("nav button").forEach(b=>b.onclick=()=>{$$("nav button").forEach(x=>x.classList.toggle("on",x===b));$$("section").forEach(s=>s.classList.toggle("on",s.id==="t-"+b.dataset.tab))});

/* IA */
async function ai(){return localStorage.getItem("hlepi:gkey")||askKey()}
function askKey(){const k=prompt("Collez votre clé Google Gemini gratuite (aistudio.google.com). Elle reste uniquement sur cet appareil :");if(k&&k.trim()){localStorage.setItem("hlepi:gkey",k.trim());return k.trim()}return null}
const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(b)});
async function pickModels(key){
 let c=null;try{c=JSON.parse(localStorage.getItem("hlepi:models")||"null")}catch(e){}
 if(c&&c.k===key.slice(-6)&&Date.now()-c.t<864e5&&c.l.length)return c.l;
 const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",{headers:{"x-goog-api-key":key}});
 let l=[];
 if(r.ok){const d=await r.json(),v=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]);
  l=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")&&/^models\/gemini-[\d.]+-flash(-preview.*)?$/.test(m.name)&&!/image|tts|live|audio/.test(m.name)).sort((a,b)=>v(b.name)-v(a.name)).map(m=>m.name.replace("models/",""))}
 l=l.slice(0,4).concat(["gemini-flash-latest","gemini-flash-lite-latest"]);
 try{localStorage.setItem("hlepi:models",JSON.stringify({k:key.slice(-6),t:Date.now(),l}))}catch(e){}
 return l}
async function call(parts,onText){const key=await ai();if(!key)throw{code:"none"};
 let models;try{models=await pickModels(key)}catch(e){models=["gemini-flash-latest"]}
 let last={};
 for(const m of models){
  let r;try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{parts}]})})}catch(e){throw{detail:"réseau : "+e.message}}
  if(r.ok){const d=await r.json(),t=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
   if(t){if(onText)onText({text:t});return t}last={detail:m+" : réponse vide"};continue}
  let msg="";try{msg=(await r.json()).error.message}catch(e){}
  if(r.status===401||r.status===403||/api key not valid|API_KEY_INVALID/i.test(msg)){localStorage.removeItem("hlepi:gkey");throw{code:"none"}}
  last=r.status===429?{code:"rate_limited"}:{detail:(r.status+" "+m+" : "+msg).slice(0,200)}}
 try{localStorage.removeItem("hlepi:models")}catch(e){}
 throw last}
const SYS="Tu es l'assistant d'un réalisateur et monteur vidéo francophone. Réponds en français, de façon concrète et concise, sans préambule. ";
function errMsg(e){const c=e&&e.code;return c==="none"||c==="not_granted"?"L'IA n'est pas disponible ou l'accès a été refusé.":c==="rate_limited"?"Trop de demandes. Réessayez dans un instant.":e&&e.detail?"L'IA a répondu par une erreur : "+e.detail:"L'IA n'a pas répondu. Réessayez."}
async function ask(prompt,o={}){const text=SYS+prompt+(o.json?"\n\nRéponds uniquement avec du JSON valide, sans texte autour.":"");
 const parts=[];if(o.images)for(const i of o.images)parts.push({inline_data:{mime_type:"image/jpeg",data:await b64(i)}});parts.push({text});
 const t=await call(parts,o.onText);
 if(!o.json)return t;const c=t.replace(/```json|```/g,"").trim();try{return JSON.parse(c)}catch(e){const m=c.match(/\[[\s\S]*\]/);return JSON.parse(m[0])}}
function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
async function run(btn,box,fn){const old=btn.textContent;btn.disabled=true;btn.classList.add("busy");btn.textContent="…";box.classList.remove("err");try{await fn()}catch(e){box.classList.add("err");box.textContent=errMsg(e)}btn.disabled=false;btn.classList.remove("busy");btn.textContent=old}

/* Écrire */
const ta=$("#script");ta.value=S.script;$("#title").value=S.title;
ta.oninput=()=>{S.script=ta.value;save()};$("#title").oninput=e=>{S.title=e.target.value;save()};
function insertAt(txt,a=ta.selectionStart,b=ta.selectionEnd){ta.setRangeText(txt,a,b,"end");ta.focus();S.script=ta.value;save()}
$$("[data-ins]").forEach(b=>b.onclick=()=>insertAt((ta.value&&!ta.value.endsWith("\n\n")?"\n\n":"")+b.dataset.ins+"\n"));
let pend=null;
function showW(text,replace){pend={text,replace,a:ta.selectionStart,b:ta.selectionEnd};$("#wout").classList.remove("err");$("#wout").innerHTML=md(text);$("#wact").hidden=false;$("#ins").textContent=replace?"Remplacer la sélection":"Insérer dans le scénario"}
async function writeAI(btn,prompt,replace){$("#wact").hidden=true;await run(btn,$("#wout"),async()=>{const t=await ask(prompt,{onText:r=>{$("#wout").textContent=r.text}});showW(t.trim(),replace)})}
const ctx=()=>S.script.slice(-2500);
$$("[data-ai]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.ai,sel=ta.value.slice(ta.selectionStart,ta.selectionEnd);
  if(k==="continue")return writeAI(b,`Voici un scénario au format classique :\n${ctx()}\n\nÉcris la suite immédiate (une courte scène ou 8 à 12 lignes), au même format, sans commentaire.`,false);
  if(!sel){$("#wout").classList.add("err");$("#wout").textContent="Sélectionnez d'abord un passage dans le scénario.";return}
  const ins=k==="rewrite"?"Reformule ce passage avec plus de précision visuelle, en gardant le sens et le format.":"Réécris les dialogues de ce passage pour qu'ils sonnent plus naturels et oraux, en gardant le sens et le format.";
  writeAI(b,`${ins}\n\nPassage :\n${sel}\n\nRéponds uniquement avec le texte réécrit.`,true)});
$("#go").onclick=()=>{const q=$("#q").value.trim();if(!q)return;writeAI($("#go"),`Contexte du scénario (fin) :\n${ctx()||"(vide)"}\n\nDemande : ${q}`,false)};
$("#ins").onclick=()=>{if(!pend)return;pend.replace?insertAt(pend.text,pend.a,pend.b):insertAt((ta.value&&!ta.value.endsWith("\n")?"\n\n":"")+pend.text+"\n");$("#wact").hidden=true;$("#wout").textContent=""};

/* Plans */
function renderShots(from=Infinity){const el=$("#shots");if(!S.shots.length){el.innerHTML='<p class="empty">Aucun plan pour l\'instant. Ajoutez-en un ou demandez un découpage à l\'IA.</p>';return}
 el.innerHTML=S.shots.map((s,i)=>`<div class="shot${i>=from?" new":""}" style="animation-delay:${Math.max(0,i-from)*60}ms"><div><b>Plan ${i+1}${s.scene?" · "+esc(s.scene):""}</b><span>${esc(s.size)}, ${esc(s.move)}</span><p>${esc(s.desc)}</p></div><button data-del="${i}" aria-label="Supprimer le plan ${i+1}">×</button></div>`).join("")}
$("#shots").onclick=e=>{const d=e.target.dataset.del;if(d===undefined)return;const c=e.target.closest(".shot"),fin=()=>{S.shots.splice(+d,1);save();renderShots()};if(matchMedia("(prefers-reduced-motion:reduce)").matches||!c)return fin();c.classList.add("gone");setTimeout(fin,200)};
$("#addshot").onclick=()=>{const desc=$("#s-desc").value.trim();if(!desc)return $("#s-desc").focus();const n=S.shots.length;S.shots.push({scene:$("#s-scene").value.trim(),size:$("#s-size").value,move:$("#s-move").value,desc});$("#s-desc").value="";save();renderShots(n)};
$("#aishots").onclick=()=>{const b=$("#aishots");if(!S.script.trim()){$("#sout").classList.add("err");$("#sout").textContent="Écrivez d'abord un début de scénario.";return}
 run(b,$("#sout"),async()=>{$("#sout").textContent="Découpage en cours…";const r=await ask(`Voici un scénario :\n${S.script.slice(0,6000)}\n\nPropose un découpage technique de 6 à 10 plans. Réponds uniquement avec un tableau JSON d'objets {"scene":string,"size":"Plan large|Plan moyen|Plan rapproché|Gros plan|Insert|Plan d'ensemble","move":"Fixe|Panoramique|Travelling|Épaule|Steadicam|Drone","desc":string}.`,{json:true});
  const arr=(Array.isArray(r)?r:r.shots||[]).filter(x=>x&&x.desc);if(!arr.length)throw{};const n=S.shots.length;arr.forEach(x=>S.shots.push({scene:x.scene||"",size:x.size||"Plan moyen",move:x.move||"Fixe",desc:x.desc}));save();renderShots(n);$("#sout").textContent=arr.length+" plans ajoutés."})};
renderShots();

/* Repérage */
let photo=null;$("#intent").value=S.loc.intent;$("#lout").innerHTML=md(S.loc.out||"");
$("#intent").oninput=e=>{S.loc.intent=e.target.value;save()};
function shrink(f,max=1024){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.8)};im.onerror=rej;im.src=u})}
$("#photo").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photo=await shrink(f);const p=$("#prev");p.src=URL.createObjectURL(photo);p.style.display="block"}catch(x){photo=null;$("#lout").classList.add("err");$("#lout").textContent="Cette image n'a pas pu être lue."}};
$("#analyze").onclick=()=>{const b=$("#analyze"),box=$("#lout");if(!photo){box.classList.add("err");box.textContent="Ajoutez d'abord une photo du lieu.";return}
 run(b,box,async()=>{const s=await ai();if(!s)throw{code:"none"};
  const prompt=`Voici la photo d'un lieu de tournage.\nIntention du réalisateur : ${S.loc.intent||"non précisée"}.\nContexte du scénario (début) : ${S.script.slice(0,1500)||"non fourni"}.\n\nDonne, en listes courtes avec ces titres en gras :\n**Le lieu** (atouts et contraintes)\n**Aménagement du décor** (où placer meubles, accessoires, acteurs)\n**Positions de caméra** (plans possibles)\n**Lumière**\n**Son**\n**Points de vigilance**`;
  const t=await ask(prompt,{images:[photo],onText:r=>{box.textContent=r.text}});S.loc.out=t.trim();save();box.innerHTML=md(S.loc.out)})};
</script>
</body>
  </html>
