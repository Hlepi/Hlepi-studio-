name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparer le projet
        run: |
          mkdir -p www && cp "$(ls | grep -i '^index.html$' | head -1)" www/index.html
          echo '{"name":"hlepi-studio","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.hlepi.studio","appName":"Hlepi studio","webDir":"www"}' > capacitor.config.json
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Construire l APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hlepi-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
